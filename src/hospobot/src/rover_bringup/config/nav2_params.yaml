planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.1
      allow_unknown: false
      cost_travel_multiplier: 2.0
      downsample_costmap: false
      downsampling_factor: 1

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "RegulatedPurePursuit"]

    # Primary Local Controller: MPPI
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 0.8
      ax_min: -0.8
      az_max: 1.0
      az_min: -1.0
      vx_std: 0.2
      vy_std: 0.0
      vw_std: 0.4
      vx_max: 0.5
      vx_min: -0.5
      vw_max: 1.0
      vw_min: -1.0
      # Kinematic Model
      model_type: "diff"
      # Accelerations per the prompt specifications
      max_accel_x: 0.8
      max_decel_x: 0.8
      max_accel_theta: 1.0
      max_decel_theta: 1.0
      # Critics Configuration
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic"]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        cost_power: 1
        cost_weight: 3.81
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        max_heuristic_delay: 0.1

    # Alternative/Fallback Local Controller: Regulated Pure Pursuit
    RegulatedPurePursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      regulated_linear_vel_scaling: true
      use_velocity_scaled_lookahead: true
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_collision_checking: true

    # Goal Checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true # Exact non-linear smoothing
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.0]
    max_decel: [0.8, 0.0, 1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
