ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    publish_tf: true

    # 1. Wheel odometry: forward linear velocity (X) and differential yaw (Yaw)
    # Serves as the coarse motion prediction for SLAM Toolbox Ceres scan matcher
    odom0: /odom_can
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 2. VIO / Camera IMU (OAK-D Pro): Drift-free gyroscope yaw velocity (Yaw)
    # Fuses visual-inertial heading with wheel odometry without corridor slip
    odom1: /oak/vio/odometry_fixed
    odom1_config: [false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

