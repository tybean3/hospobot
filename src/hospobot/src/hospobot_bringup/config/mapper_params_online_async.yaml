slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Ceres Scan Matching tuning for robust wall alignment
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.04
    scan_buffer_size: 50
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 2.0
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.3

    fine_search_angle_offset: 0.0349
    coarse_search_angle_offset: 0.785
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.1
    minimum_distance_penalty: 0.1
    use_response_expansion: true
    
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 1.5
    tf_buffer_duration: 10.0
    stack_capacity: 40000000
    enable_interactive_mode: true
